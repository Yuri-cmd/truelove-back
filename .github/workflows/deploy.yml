name: Deploy Scorpion (Laravel on Ubuntu)

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy to Ubuntu via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}   # root
          key: ${{ secrets.SERVER_SSH_KEY }}     # tu id_rsa
          port: 22
          script: |
            echo "Entrando al proyecto..."
            cd /var/www/html/truelove-back

            echo "Asegurando permisos iniciales..."
            chown -R www-data:www-data storage bootstrap/cache public
            chmod -R 775 storage bootstrap/cache public

            echo "Actualizando repositorio..."
            git pull origin main

            echo "Instalando dependencias..."
            # Forzamos que composer no cree archivos como root si es posible
            # o corregimos inmediatamente después.
            composer install --no-interaction --prefer-dist --optimize-autoloader
            chown -R www-data:www-data vendor storage bootstrap/cache public

            echo "Optimizando Laravel..."
            sudo -u www-data php artisan config:cache
            sudo -u www-data php artisan route:cache
            sudo -u www-data php artisan view:cache
            sudo -u www-data php artisan event:cache

            echo "Permisos finales de seguridad..."
            chown -R www-data:www-data storage bootstrap/cache public
            chmod -R 775 storage bootstrap/cache public

            echo "Deploy completado exitosamente."
