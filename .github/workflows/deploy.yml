name: Deploy Scorpion (Laravel on CentOS)

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy to CentOS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}   # root
          key: ${{ secrets.SERVER_SSH_KEY }}     # tu id_rsa
          port: 22
          script: |
            echo "Entrando al proyecto..."
            cd /var/www/html/truelove-back

            echo "Asegurando permisos iniciales..."
            chown -R apache:apache storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            echo "Actualizando repositorio..."
            git pull origin master

            echo "Instalando dependencias..."
            # Forzamos que composer no cree archivos como root si es posible
            # o corregimos inmediatamente después. Prefiero usar sudo -u apache
            # pero a veces apache no tiene shell, así que usamos chown justo después.
            composer install --no-interaction --prefer-dist --optimize-autoloader
            chown -R apache:apache vendor storage bootstrap/cache

            echo "Optimizando Laravel..."
            sudo -u apache php artisan config:cache
            sudo -u apache php artisan route:cache
            sudo -u apache php artisan view:cache
            sudo -u apache php artisan event:cache

            echo "Permisos finales de seguridad..."
            chown -R apache:apache storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            echo "Deploy completado exitosamente."
